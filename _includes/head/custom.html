{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- Personal ZW monogram, shared across browser and search icons. -->
<meta name="application-name" content="{{ site.title | escape }}"/>
<meta name="apple-mobile-web-app-title" content="{{ site.title | escape }}"/>
<link rel="icon" type="image/x-icon" href="{{ base_path }}/images/favicon.ico" sizes="16x16 32x32 48x48"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-48x48.png" sizes="48x48"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg" sizes="any"/>
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<meta name="theme-color" content="#ffffff"/>

<!-- end custom head snippets -->
